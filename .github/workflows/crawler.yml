name: Get Hot News

on:
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ⚠️ 试用版说明 / Trial Mode
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 🔄 运行机制 / How it works:
    #    - 每个周期为 7 天，届时自动停止
    #    - 运行 "Check In" 会重置周期（重新开始 7 天倒计时，而非累加）
    #    - Each cycle is 7 days, then auto-stops
    #    - "Check In" resets the cycle (restarts 7-day countdown, not cumulative)
    #
    # 💡 设计初衷 / Why this design:
    #    如果 7 天都忘了签到，或许这些资讯对你来说并非刚需
    #    适时的暂停，能帮你从信息流中抽离，给大脑留出喘息的空间
    #    If you forget for 7 days, maybe you don't really need it
    #    A timely pause helps you detach from the stream and gives your mind space
    #
    # 🙏 珍惜资源 / Respect shared resources:
    #    GitHub Actions 是平台提供的公共资源，每次运行都会消耗算力
    #    签到机制确保资源分配给真正需要的用户，感谢你的理解与配合
    #    GitHub Actions is a shared public resource provided by the platform
    #    Check-in ensures resources go to those who truly need it — thank you
    #
    # 🚀 长期使用请部署 Docker 版本 / For long-term use, deploy Docker version
    #
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 📝 修改运行时间：只改第一个数字（0-59），表示每小时第几分钟运行
    # 📝 Change time: Only modify the first number (0-59) = minute of each hour
    #
    # 示例 / Examples:
    #   "15 * * * *"     → 每小时第15分钟 / minute 15 every hour
    #   "30 0-14 * * *"  → 北京时间 8:00-22:00 每小时第30分钟 / Beijing 8am-10pm
    #
    - cron: "5 16 * * *"   # 北京 00:05（UTC+8；避整点，GitHub 整点负载高容易丢）

  workflow_dispatch:
    inputs:
      force:
        description: "强制运行（跳过 6 小时去重检查）"
        type: boolean
        default: false

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true


      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      # - name: Random Delay (Traffic Control)
      #   if: success() && steps.guard.outputs.skip != 'true'
      #   run: |
      #     echo "🎲 Traffic Control: Generating random delay..."
      #     DELAY=$(( ( RANDOM % 300 )  + 1 ))
      #     echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
      #     sleep ${DELAY}s
      #     echo "▶️  Delay finished. Starting crawler..."

      # --------------------------------------------------------------------------------
      # 🛡 DUPLICATE GUARD / 补跑去重守卫
      #   定时触发或外部定时服务触发的 dispatch：近 6 小时内已有成功运行则跳过；
      #   手动在网页点 Run workflow 且勾选 force 时强制执行。
      # --------------------------------------------------------------------------------
      - name: Check duplicate scheduled run
        if: github.event_name == 'schedule' || github.event.inputs.force != 'true'
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/crawler.yml/runs?per_page=30"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "trendradar-guard"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          cutoff = datetime.now(timezone.utc) - timedelta(hours=6)
          recent = []
          for r in data.get("workflow_runs", []):
              if str(r["id"]) == run_id or r.get("conclusion") != "success":
                  continue
              created = datetime.strptime(r["created_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              if created > cutoff:
                  recent.append(r)
          print(f"近 6 小时内的成功运行: {len(recent)} 次")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("skip=%s\n" % ("true" if recent else "false"))
          PY

      - name: Set up Python
        if: success() && steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success() && steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success() && steps.guard.outputs.skip != 'true'
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Run crawler
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: |
          set -o pipefail
          uv run python -m trendradar 2>&1 | tee crawler.log

      # --------------------------------------------------------------------------------
      # 🩺 HEALTH CHECK / 静默失效监控
      #   跑成功但"0 条匹配"或"大面积挂源"也会告警，避免无声失效
      # --------------------------------------------------------------------------------
      - name: Health check
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          log = open("crawler.log", encoding="utf-8", errors="replace").read()
          m = re.search(r"成功: \[(.*?)\], 失败: \[(.*?)\]", log)
          def count(blob):
              return len([x for x in re.split(r",\s*", (blob or "").strip(" '")) if x.strip(" '")])
          ok = count(m.group(1)) if m else -1
          bad = count(m.group(2)) if m else -1
          hot = max([int(x) for x in re.findall(r"有 (\d+) 条频率词匹配", log)] or [0])
          rss = max([int(x) for x in re.findall(r"关键词分组统计：(\d+)/", log)] or [0])
          dedup = re.findall(r"\[去重\] 合并跨平台重复标题 (\d+) 条", log)
          print(f"平台成功 {ok} / 失败 {bad}；热榜匹配 {hot}，RSS 匹配 {rss}，去重合并 {dedup[0] if dedup else 0}")
          problems = []
          if ok <= 0:
              problems.append("没有任何平台抓取成功")
          if bad >= 5:
              problems.append(f"失败平台过多（{bad} 个）")
          if hot + rss == 0:
              problems.append("关键词匹配 0 条，词表可能需要调整")
          if not problems:
              sys.exit(0)
          text = "⚠️ TrendRadar 数据异常\n" + "\n".join("- " + x for x in problems) + f"\n平台成功 {ok}/失败 {bad}，匹配 {hot}+{rss}"
          hook = os.environ.get("FEISHU_WEBHOOK_URL", "")
          if hook:
              body = json.dumps({"msg_type": "text", "content": {"text": text}}).encode()
              req = urllib.request.Request(hook, data=body, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=20).read()
          print("已发送异常告警：" + "; ".join(problems))
          sys.exit(0)
          PY

      # --------------------------------------------------------------------------------
      # 🌐 GITHUB PAGES / 部署网页报告（无需额外凭证，手机可直接打开）
      #   访问地址: https://<用户名>.github.io/<仓库名>/
      # --------------------------------------------------------------------------------
      - name: Prepare Pages assets
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          rm -rf pages_dist && mkdir -p pages_dist
          if [ -f output/html/latest/current.html ]; then
            cp output/html/latest/current.html pages_dist/index.html
          elif [ -f index.html ]; then
            cp index.html pages_dist/index.html
          else
            echo "未找到 HTML 报告"; exit 1
          fi
          ls -lh pages_dist

      - name: Configure Pages
        if: success() && steps.guard.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_dist

      - name: Deploy to GitHub Pages
        if: success() && steps.guard.outputs.skip != 'true'
        id: pages_deploy
        uses: actions/deploy-pages@v4

      # --------------------------------------------------------------------------------
      # 🚨 FAILURE ALERT / 失败时飞书告警
      # --------------------------------------------------------------------------------
      - name: Notify failure on Feishu
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then echo "未配置 webhook，跳过告警"; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          cat > /tmp/alert.json <<EOF
          {"msg_type":"text","content":{"text":"⚠️ TrendRadar 云端运行失败\n时间：$NOW\n仓库：${{ github.repository }}\n日志：$RUN_URL"}}
          EOF
          curl -sS -X POST -H "Content-Type: application/json" --data @/tmp/alert.json "$FEISHU_WEBHOOK_URL" || true
